<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gem Cutter MVP</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18202a;
      --muted: #5e6a78;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-2: #b91c1c;
      --bg: #f7f8fa;
      --panel: #ffffff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
      line-height: 1.5;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px 18px 56px;
    }
    h1, h2 { margin: 0 0 14px; }
    h1 { font-size: 30px; }
    h2 { font-size: 20px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 18px;
      align-items: start;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    label {
      display: block;
      font-weight: 700;
      margin: 12px 0 6px;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
    }
    textarea { min-height: 86px; resize: vertical; }
    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
    }
    button.secondary { background: #334155; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .muted { color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 82px;
    }
    .metric strong {
      display: block;
      font-size: 24px;
      margin-top: 4px;
    }
    .events {
      max-height: 220px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #fbfcfd;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    .evidence, .scores { display: grid; gap: 10px; }
    .logs {
      display: grid;
      gap: 12px;
    }
    .item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .log-columns {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .log-box {
      min-height: 160px;
      max-height: 300px;
      overflow: auto;
      background: #101820;
      color: #e5eef7;
      border-radius: 8px;
      padding: 12px;
      font-family: Consolas, monospace;
      font-size: 13px;
      white-space: pre-wrap;
    }
    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 8px;
      background: #e7f7f5;
      color: #0f766e;
      font-size: 12px;
      margin-right: 6px;
    }
    pre {
      white-space: pre-wrap;
      background: #101820;
      color: #e5eef7;
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
    }
    @media (max-width: 820px) {
      .layout, .grid, .log-columns { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Gem Cutter MVP</h1>
    <p class="muted">证据账本、评分账本、决策门和报告/PRD 渲染的最小闭环。</p>
    <div class="layout">
      <section>
        <h2>开始评估</h2>
        <label for="apiBase">API 地址</label>
        <input id="apiBase" value="http://127.0.0.1:8000" />
        <label for="title">项目标题</label>
        <input id="title" value="AI 视频脚本生成工具" />
        <label for="topic">热点/想法</label>
        <textarea id="topic">AI video script generation tool for creators</textarea>
        <label for="market">目标市场</label>
        <input id="market" value="China independent creators and small teams" />
        <label for="users">目标用户线索</label>
        <input id="users" value="短视频创作者、内容运营、小型营销团队" />
        <button id="startBtn">创建并评估</button>
        <button id="prdBtn" class="secondary" disabled>生成 PRD</button>
      </section>
      <section>
        <h2>运行状态</h2>
        <div class="grid">
          <div class="metric">Gate<strong id="gate">-</strong></div>
          <div class="metric">总分<strong id="score">-</strong></div>
          <div class="metric">置信度<strong id="confidence">-</strong></div>
          <div class="metric">有效证据<strong id="evidenceCount">-</strong></div>
        </div>
        <h2 style="margin-top:18px;">事件</h2>
        <div class="events" id="events"></div>
      </section>
    </div>
    <section style="margin-top:18px;">
      <h2>模型日志</h2>
      <p class="muted">查看 Ark 流式返回的思考摘要、正文片段和调用状态。</p>
      <button id="logsRefreshBtn" class="secondary">刷新模型日志</button>
      <div class="logs" id="llmLogs" style="margin-top:12px;"></div>
    </section>
    <section style="margin-top:18px;">
      <h2>评分账本</h2>
      <div class="scores" id="scores"></div>
    </section>
    <section style="margin-top:18px;">
      <h2>证据账本</h2>
      <div class="evidence" id="evidence"></div>
    </section>
    <section style="margin-top:18px;">
      <h2>报告</h2>
      <pre id="report">评估完成后显示结构化报告摘要。</pre>
    </section>
  </main>
  <script>
    let currentRunId = null;
    let pollTimer = null;

    const $ = (id) => document.getElementById(id);
    const apiBase = () => $("apiBase").value.replace(/\/$/, "");

    function log(message) {
      const line = document.createElement("div");
      line.textContent = `${new Date().toLocaleTimeString()} ${message}`;
      $("events").appendChild(line);
      $("events").scrollTop = $("events").scrollHeight;
    }

    async function request(path, options = {}) {
      const res = await fetch(`${apiBase()}${path}`, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    async function refreshView() {
      if (!currentRunId) return;
      const view = await request(`/api/evaluations/${currentRunId}/view`);
      const gate = view.gate_decision || {};
      $("gate").textContent = gate.action || "-";
      $("score").textContent = gate.total_score ?? "-";
      $("confidence").textContent = gate.confidence ?? "-";
      $("evidenceCount").textContent = view.evidence_summary.valid_evidence_count;
      $("prdBtn").disabled = !["go", "conditional_go"].includes(gate.action);

      $("scores").innerHTML = "";
      for (const score of view.score_summary.dimensions || []) {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<span class="tag">${score.dimension}</span>
          <strong>${score.score}</strong> confidence ${score.confidence}
          <p>${score.rationale}</p>
          <p class="muted">Evidence: ${(score.positive_evidence_ids || []).join(", ") || "none"}</p>`;
        $("scores").appendChild(div);
      }

      const evidence = await request(`/api/evaluations/${currentRunId}/evidence`);
      $("evidence").innerHTML = "";
      for (const item of evidence.evidence || []) {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<span class="tag">${item.dimension}</span><span class="tag">${item.source_platform}</span>
          <strong>${item.title}</strong>
          <p>${item.summary}</p>
          <p class="muted">${item.id} | credibility ${item.credibility_score} | hotness ${item.hotness_score}</p>`;
        $("evidence").appendChild(div);
      }

      $("report").textContent = JSON.stringify(view, null, 2);
      return view;
    }

    async function refreshLogs() {
      if (!currentRunId) return;
      const result = await request(`/api/evaluations/${currentRunId}/llm-logs`);
      $("llmLogs").innerHTML = "";
      if (!result.logs.length) {
        const empty = document.createElement("div");
        empty.className = "item muted";
        empty.textContent = "暂无模型调用日志。";
        $("llmLogs").appendChild(empty);
        return;
      }
      for (const item of result.logs) {
        const div = document.createElement("div");
        div.className = "item";

        const title = document.createElement("div");
        title.innerHTML = `<span class="tag">${item.status}</span><span class="tag">${item.dimension || "unknown"}</span>
          <strong>${item.purpose}</strong>
          <p class="muted">${item.id} | ${item.model} | events ${item.event_count}</p>
          <p class="muted">${item.query || ""}</p>`;
        div.appendChild(title);

        const columns = document.createElement("div");
        columns.className = "log-columns";
        const reasoning = document.createElement("div");
        const output = document.createElement("div");
        reasoning.innerHTML = "<strong>思考内容</strong>";
        output.innerHTML = "<strong>正文</strong>";
        const reasoningBox = document.createElement("div");
        const outputBox = document.createElement("div");
        reasoningBox.className = "log-box";
        outputBox.className = "log-box";
        reasoningBox.textContent = item.reasoning_text || "暂无思考内容片段。";
        outputBox.textContent = item.output_text || item.error || "暂无正文片段。";
        reasoning.appendChild(reasoningBox);
        output.appendChild(outputBox);
        columns.appendChild(reasoning);
        columns.appendChild(output);
        div.appendChild(columns);
        $("llmLogs").appendChild(div);
      }
    }

    async function pollRun() {
      if (!currentRunId) return;
      try {
        const view = await refreshView();
        await refreshLogs();
        if (view && ["completed", "failed", "cancelled"].includes(view.run.status)) {
          clearInterval(pollTimer);
          pollTimer = null;
          $("startBtn").disabled = false;
        }
      } catch (error) {
        log(error.message);
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(pollRun, 2500);
    }

    $("startBtn").addEventListener("click", async () => {
      $("startBtn").disabled = true;
      $("events").innerHTML = "";
      try {
        const project = await request("/api/projects", {
          method: "POST",
          body: JSON.stringify({
            title: $("title").value,
            input_topic: $("topic").value,
            target_market: $("market").value,
            target_user_hint: $("users").value,
          }),
        });
        log(`project.created ${project.project.id}`);
        const started = await request(`/api/projects/${project.project.id}/evaluations`, { method: "POST" });
        currentRunId = started.run.id;
        log(`evaluation.started ${currentRunId}`);
        await refreshLogs();
        startPolling();
        const stream = new EventSource(`${apiBase()}/api/evaluations/${currentRunId}/stream`);
        const handleStreamEvent = async (event) => {
          log(event.data);
          await pollRun();
        };
        stream.onmessage = async (event) => {
          await handleStreamEvent(event);
        };
        [
          "evaluation.started", "plan.created", "evidence.search_started", "raw_signal.added",
          "evidence.added", "evidence.clustered", "score.updated", "gate.decided",
          "report.generated", "evaluation.completed", "evaluation.failed"
        ].forEach((name) => stream.addEventListener(name, handleStreamEvent));
        stream.onerror = async () => {
          stream.close();
          await pollRun();
        };
      } catch (error) {
        log(error.message);
        $("startBtn").disabled = false;
      }
    });

    $("prdBtn").addEventListener("click", async () => {
      if (!currentRunId) return;
      try {
        const result = await request(`/api/evaluations/${currentRunId}/prd`, { method: "POST" });
        log(`prd.generated ${result.report.id}`);
        await refreshView();
      } catch (error) {
        log(error.message);
      }
    });

    $("logsRefreshBtn").addEventListener("click", refreshLogs);
  </script>
</body>
</html>
